<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to the Inventory Management System demo.">
  <title>Login | Inventory Management System</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-brand">
        <span class="login-brand-icon">
          <svg aria-hidden="true" class="ui-icon large" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"></rect><path d="M3 11h18M8 7V4h8v3"></path></svg>
        </span>
        <div><span class="login-brand-name">INVENTORY</span><span class="login-brand-description">Management System</span></div>
      </div>
      <div class="login-content">
        <p class="login-eyebrow">WELCOME BACK</p>
        <h1 id="login-title">Sign in to your workspace</h1>
        <p class="login-description">Enter your details to continue to the inventory dashboard.</p>
        <form class="login-form" action="dashboard.html" method="get">
          <div class="login-field">
            <label for="username">Username</label>
            <div class="login-input-wrap">
              <svg aria-hidden="true" class="ui-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-2a8 8 0 0 1 16 0v2"></path></svg>
              <input id="username" type="text" placeholder="Enter username" autocomplete="username" required>
            </div>
          </div>
          <div class="login-field">
            <label for="password">Password</label>
            <div class="login-input-wrap">
              <svg aria-hidden="true" class="ui-icon" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
              <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary login-submit">
            <span>Sign In</span>
            <svg aria-hidden="true" class="ui-icon" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </button>
        </form>
        <p class="login-demo-note">Demo access: enter any username and password.</p>
      </div>
      <p class="login-bottom">&copy; 2026 Inventory Management System</p>
    </section>
  </main>
</body>
</html>
